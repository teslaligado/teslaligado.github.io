# Avisa os motores de busca que suportam IndexNow (Bing, Yandex, Seznam, Naver)
# quando páginas do site mudam. O Google não participa no IndexNow.
#
# A chave vive em https://teslaligado.pt/<chave>.txt, gerada pelo próprio site
# a partir do campo indexNowKey das Definições do painel. Não é um segredo:
# a especificação do IndexNow exige que seja pública nesse endereço.
#
# Só são submetidas URLs que estão no sitemap.xml, ou seja, as páginas que
# queremos indexadas. Os artigos diários estão em noindex e ficam de fora.
#
#   push   → as páginas do sitemap que mudaram nesse push.
#   manual → o sitemap inteiro (Actions → IndexNow → Run workflow).

name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submeter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reunir as URLs a submeter
        id: lista
        env:
          BEFORE: ${{ github.event.before }}
          EVENTO: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          HOST = "teslaligado.pt"
          KEY  = "65e99f72d37e01855d508c7d987b4a37"

          try:
              sitemap = set(re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read()))
          except OSError:
              sitemap = set()

          def url_de(f):
              return "https://%s/%s" % (HOST, "" if f == "index.html" else f)

          if os.environ.get("EVENTO") == "workflow_dispatch":
              origem = "sitemap completo"
              urls = sorted(sitemap)
          else:
              origem = "páginas do sitemap alteradas neste push"
              antes = os.environ.get("BEFORE", "")
              base = antes if antes and not antes.startswith("0000000") else "HEAD~1"
              try:
                  mudadas = subprocess.check_output(
                      ["git", "diff", "--name-only", "--diff-filter=d", base, "HEAD"],
                      text=True).split()
              except subprocess.CalledProcessError:
                  mudadas = subprocess.check_output(["git", "ls-files"], text=True).split()
              urls = sorted({url_de(f) for f in mudadas if f.endswith(".html")} & sitemap)

          urls = urls[:100]

          json.dump({
              "host": HOST,
              "key": KEY,
              "keyLocation": "https://%s/%s.txt" % (HOST, KEY),
              "urlList": urls,
          }, open("indexnow.json", "w"))

          print("%s: %d URLs (sitemap tem %d)" % (origem, len(urls), len(sitemap)))
          for u in urls:
              print("  " + u)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("n=%d\n" % len(urls))
          PY

      - name: Enviar ao IndexNow
        if: steps.lista.outputs.n != '0'
        run: |
          code=$(curl -sS -o resposta.txt -w '%{http_code}' \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @indexnow.json)
          echo "HTTP $code"
          cat resposta.txt || true
          # 200 = aceite, 202 = aceite e a validar a chave. Outro valor falha o passo.
          case "$code" in 200|202) exit 0 ;; *) exit 1 ;; esac

      - name: Nada a submeter
        if: steps.lista.outputs.n == '0'
        run: echo "Nenhuma pagina do sitemap mudou neste push. Nada enviado."
