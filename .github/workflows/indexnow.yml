# Avisa os motores de busca que suportam IndexNow (Bing, Yandex, Seznam, Naver)
# sempre que páginas do site mudam. O Google não participa no IndexNow.
#
# A chave vive em https://teslaligado.pt/<chave>.txt, gerada pelo próprio site
# a partir do campo indexNowKey das Definições do painel. Não é um segredo:
# a especificação do IndexNow exige que seja pública nesse endereço.

name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submeter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reunir as páginas alteradas
        id: lista
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          HOST = "teslaligado.pt"
          KEY  = "65e99f72d37e01855d508c7d987b4a37"

          before = os.environ.get("GITHUB_EVENT_BEFORE", "")
          rng = ["HEAD~1", "HEAD"]
          if before and not before.startswith("0000000"):
              rng = [before, "HEAD"]
          try:
              out = subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=d", rng[0], rng[1]],
                  text=True)
          except subprocess.CalledProcessError:
              out = subprocess.check_output(["git", "ls-files"], text=True)

          urls = []
          for f in out.split():
              if not f.endswith(".html"):
                  continue
              path = "" if f == "index.html" else f
              urls.append("https://%s/%s" % (HOST, path))
          urls = sorted(set(urls))[:100]

          payload = {
              "host": HOST,
              "key": KEY,
              "keyLocation": "https://%s/%s.txt" % (HOST, KEY),
              "urlList": urls,
          }
          json.dump(payload, open("indexnow.json", "w"))
          print("%d páginas alteradas" % len(urls))
          for u in urls:
              print("  " + u)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("n=%d\n" % len(urls))
          PY

      - name: Enviar ao IndexNow
        if: steps.lista.outputs.n != '0'
        run: |
          code=$(curl -sS -o resposta.txt -w '%{http_code}' \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @indexnow.json)
          echo "HTTP $code"
          cat resposta.txt || true
          # 200 = aceite, 202 = aceite e a validar a chave. Outro valor falha o passo.
          case "$code" in 200|202) exit 0 ;; *) exit 1 ;; esac
